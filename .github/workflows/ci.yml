name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior: ninguém precisa do
# resultado de um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O script roda `next typegen` antes do tsc: `LayoutProps` e afins são
      # GERADOS pelo Next em .next/types, e next-env.d.ts é gitignored — num
      # clone limpo eles ainda não existem e o tsc reprovaria código correto.
      - name: Tipos
        run: pnpm typecheck

      # `--fix` não faz sentido no CI: aqui o lint reprova, não conserta.
      - name: Lint
        run: pnpm exec eslint

      - name: Testes unitários
        run: pnpm test

      - name: Build
        run: pnpm build
        # Placeholders. A config do Firebase Web não é segredo e nada aqui
        # chega a produção — servem só para o build ter valores definidos.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'

  rules:
    name: Security Rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # O emulador do Firestore roda em Java, e o firebase-tools 15 exige 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm install --frozen-lockfile

      # As rules são o gate real de autorização do app — quem decide o que cada
      # usuário pode ler e escrever é o servidor do Google, não o cliente. Por
      # isso este job é separado: ele reprova sozinho, e reprovar aqui significa
      # que o deploy das rules não pode acontecer.
      - name: Testes de rules contra o emulador
        run: >
          pnpm exec firebase emulators:exec
          --project=farol-test --only firestore
          "pnpm exec vitest run --config vitest.rules.config.mts"
